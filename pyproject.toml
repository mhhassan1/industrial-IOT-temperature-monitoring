[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgewatch-industrial-telemetry"
version = "1.0.0"
description = "Synthetic-first edge IoT telemetry dashboard with MQTT integration, alarms, and CSV export"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Portfolio Project"}]
classifiers = ["Programming Language :: Python :: 3", "Topic :: System :: Monitoring"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["edgewatch*"]

[tool.setuptools.package-data]
edgewatch = ["web/*.html", "web/*.css", "web/*.js"]
