name: Deploy EdgeWatch static demo

# Deliberately manual: the source repository is private while under review.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish demo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
